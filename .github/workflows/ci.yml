name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # A weekly canary. Nothing in this repo rots on its own — what rots is
  # everything it installs *from*: an AUR package that gets renamed, an apt
  # package that leaves the archive, a vendor install script that changes its
  # flags. The smoke job below notices; a repo that only builds on push finds
  # out from a person whose machine is already half-installed.
  schedule:
    - cron: '0 6 * * 1'

# One run per ref: a second push cancels the first instead of queueing behind
# it. Nothing here deploys, so the older answer is never the one wanted.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default — the whole workflow only ever reads the checkout. A job
# that some day needs more asks for it in its own block rather than widening
# this one for everything.
permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The advisory pass reports only on lines this change touched, which
          # needs the commit before it — a shallow clone has neither that nor
          # the pull request's base.
          fetch-depth: 0
          # Nothing here pushes, so the token is not left in .git/config.
          persist-credentials: false

      # Both passes, the file list, and the changed-line filter live in the
      # script: one source of truth, and runnable by hand before pushing
      # rather than only discoverable from a red pipeline.
      - name: shellcheck
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: .github/lint.sh

      # actionlint checks this file the way shellcheck checks the scripts — and
      # it runs shellcheck over every `run:` block, which plain shellcheck
      # cannot see from outside the YAML. Pinned and checksum-verified, the same
      # rule install.sh applies to everything it downloads.
      - name: actionlint
        run: |
          ver=1.7.12
          sum=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          curl -fsSL -o actionlint.tgz \
            "https://github.com/rhysd/actionlint/releases/download/v${ver}/actionlint_${ver}_linux_amd64.tar.gz"
          echo "${sum}  actionlint.tgz" | sha256sum -c -
          tar -xzf actionlint.tgz actionlint
          ./actionlint -color

  test:
    name: suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # Two runners, and the interesting difference between them is bash: 5.1
      # on 22.04, 5.2 on 24.04. This is 4600 lines of bash leaning on namerefs,
      # ${var,,} and printf %-*s, so "works on my bash" is a real failure mode.
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - name: Install harness dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y stow zsh

      # The suite stubs every package manager and sandboxes HOME, so it never
      # touches the runner's real system. KEEP_WORK keeps the sandbox alive past
      # the trap so a failure has something to upload.
      - name: Run the suite
        env:
          WORK: ${{ runner.temp }}/sandbox
          KEEP_WORK: '1'
        run: |
          set -o pipefail
          mkdir -p "$WORK"
          bash tests/run.sh 2>&1 | tee "$RUNNER_TEMP/suite.log"

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Suite — ${{ matrix.os }} (bash ${BASH_VERSION})"
            echo
            echo '```'
            grep -E '^  FAIL' "$RUNNER_TEMP/suite.log" | head -20 || true
            tail -n 2 "$RUNNER_TEMP/suite.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Every assertion in the suite reads a transcript inside the sandbox, and
      # the sandbox dies with the runner — which makes a CI-only failure close to
      # undebuggable. Collect the transcripts alone: each scenario also holds a
      # full copy of the repo, so the whole tree would be a huge artifact.
      - name: Collect transcripts
        if: failure()
        run: |
          dest="$RUNNER_TEMP/transcripts"
          mkdir -p "$dest"
          for d in "$RUNNER_TEMP"/sandbox/run/*/; do
            [ -d "$d" ] || continue
            cp "$d/clean.txt" "$dest/$(basename "$d").txt" 2>/dev/null || true
          done
          cp "$RUNNER_TEMP/suite.log" "$dest/" 2>/dev/null || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: transcripts-${{ matrix.os }}
          path: ${{ runner.temp }}/transcripts
          retention-days: 7

  # Every distro gets the same script, run the way a person runs it: as a user
  # with passwordless sudo, from a repo copy it owns, installing EVERYTHING a
  # headless box can take (all configs, all tools, all CLI apps; the GUI ones
  # are stripped by the installer's own headless filter, and are only planned,
  # via --gui, in the dry run). It then checks the installer's own detection
  # against what is on disk, and runs it a second time to prove nothing moves.
  # Assertions are listed at the top of .github/smoke-checks.sh.
  #
  # "omarchy" is the same job on archlinux:base with Omarchy's user-facing
  # package installed first (see .github/omarchy.sh for how faithful that is).
  smoke:
    name: real ${{ matrix.name }} ${{ matrix.mode }}
    runs-on: ubuntu-latest
    # Ollama, the AUR and ~45 apps from their vendors, installed twice; gui
    # adds every desktop app and the fonts, and wezterm-git compiles on Arch.
    timeout-minutes: ${{ matrix.mode == 'gui' && 200 || 120 }}
    strategy:
      fail-fast: false
      matrix:
        # cli: what a headless box (a server, a container) is offered. gui:
        # everything, as on a desktop. Each distro runs both.
        name: [archlinux, debian-12, debian-13, ubuntu-24.04, ubuntu-26.04, omarchy]
        mode: [cli, gui]
        include:
          - { name: archlinux,    image: 'archlinux:base' }
          - { name: debian-12,    image: 'debian:12' }
          - { name: debian-13,    image: 'debian:13' }
          - { name: ubuntu-24.04, image: 'ubuntu:24.04' }
          - { name: ubuntu-26.04, image: 'ubuntu:26.04' }
          - { name: omarchy,      image: 'archlinux:base', flavor: omarchy }
    steps:
      # No token in the checkout: this job runs ~20 vendors' install scripts
      # with sudo beside it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      # The stubbed suite proves the branches; this proves the assumptions
      # underneath them — that the package names still exist, that real
      # pacman/apt accept the flags we hand them, that every vendor installer
      # still works, and that stow lands where the plan said it would. The repo
      # is mounted read-only: the container works on a copy it owns.
      # Every desktop app, twice, plus AUR build trees: more than the runner's
      # free disk. These are preinstalled SDKs nothing here uses.
      - name: Free disk space
        if: matrix.mode == 'gui'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install everything for real, twice, and check what landed
        env:
          LOGS: ${{ runner.temp }}/smoke-logs
          FLAVOR: ${{ matrix.flavor }}
          GUI: ${{ matrix.mode == 'gui' && '1' || '' }}
          IMAGE: ${{ matrix.image }}
        run: |
          mkdir -p "$LOGS"
          docker run --rm \
            -v "$PWD:/repo:ro" -v "$LOGS:/logs" -w /repo \
            -e SMOKE_FLAVOR="$FLAVOR" -e SMOKE_GUI="$GUI" \
            "$IMAGE" bash .github/smoke.sh

      # How each entry installs on this distro, from the installer itself
      # (the porcelain's <how> field): the run's summary page shows it, and the
      # artifact is what a cross-distro table is built from.
      - name: Install-method table
        if: always()
        env:
          LOGS: ${{ runner.temp }}/smoke-logs
          TITLE: ${{ matrix.name }} ${{ matrix.mode }}
        run: |
          [ -s "$LOGS/porcelain.txt" ] || exit 0
          {
            printf '### How each entry installs on %s\n\n| section | entry | how | version |\n|---|---|---|---|\n' "$TITLE"
            awk -F'\t' 'NR==FNR{v[$1"/"$2]=$3; next} $1!="var"{k=$1"/"$2; printf "| %s | %s | %s | %s |\n", $1, $2, $7, (k in v ? v[k] : "-")}' \
              "$LOGS/versions.txt" "$LOGS/porcelain.txt"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: table-${{ matrix.name }}-${{ matrix.mode }}
          path: |
            ${{ runner.temp }}/smoke-logs/porcelain.txt
            ${{ runner.temp }}/smoke-logs/versions.txt
          if-no-files-found: ignore
          retention-days: 30

      # Every assertion reads a transcript inside the container, and the
      # container dies with the step — the same reason the suite job keeps its
      # own. The raw pty capture is kept too: it is what the terminal showed.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: smoke-${{ matrix.name }}-${{ matrix.mode }}
          path: ${{ runner.temp }}/smoke-logs
          retention-days: 7

  linux-sh-unchanged:
    name: linux.sh deploy reminder
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }

      # It is deployed by hand to a hosted URL, so a change here means the
      # hosted copy is stale until someone re-pastes it. A warning, never a
      # failure: the deploy is a human step and cannot be verified from here.
      - name: Warn if linux.sh changed
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A first push to a branch reports an all-zero "before", and a tag or
          # a schedule reports nothing at all — neither is a diff, so fall back
          # to the previous commit rather than printing a git error.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE=$(git rev-parse 'HEAD^' 2>/dev/null || git rev-parse HEAD)
          fi
          if git diff --quiet "$BASE" HEAD -- linux.sh; then
            echo "linux.sh unchanged"
          else
            echo "::warning file=linux.sh::linux.sh changed — re-deploy it to the hosted URL"
            echo '### linux.sh changed — re-deploy it to the hosted URL' >> "$GITHUB_STEP_SUMMARY"
          fi
