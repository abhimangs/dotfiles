# ── Where this file is read from ─────────────────────────────────────────────
# tmux 3.1+ reads ~/.config/tmux/tmux.conf (or $XDG_CONFIG_HOME/tmux/tmux.conf)
# on its own. Anything older reads only ~/.tmux.conf and ignores this file
# without a word — check `tmux -V` first if none of the below seems to apply.

# ── General ──────────────────────────────────────────────────────────────────
set -g  default-terminal    "tmux-256color"
# Truecolor whatever the outer $TERM claims. Needs tmux 3.2+; on 3.1 the
# equivalent is: set -ga terminal-overrides ",*256col*:Tc"
set -as terminal-features   ",*:RGB"
# The default 500ms swallows Esc, which is unusable in micro or a vim mode.
set -sg escape-time         10
set -g  mouse                on
# OSC 52, so a selection reaches the system clipboard with no xclip or
# wl-copy in the middle. kitty, ghostty, alacritty and wezterm all honour it.
set -g  set-clipboard        on
set -g  history-limit        10000      # same scrollback kitty and wezterm use
set -g  base-index           1
set -g  pane-base-index      1
set -g  renumber-windows     on
set -g  mode-keys            vi

# ── Status bar (Catppuccin Mocha) ────────────────────────────────────────────
# The active-window mauve is kitty's own active_tab_background from
# current-theme.conf, so a tmux tab and a kitty tab are the same colour.
set -g status-style                 "bg=#181825,fg=#cdd6f4"
set -g status-justify               left
set -g status-left-length           40
set -g status-right-length          40
set -g status-left                  "#[bg=#cba6f7,fg=#11111b,bold] #S #[bg=#181825,fg=#cdd6f4,nobold] "
set -g status-right                 "#[fg=#6c7086]%Y-%m-%d  #[fg=#cdd6f4,bold]%H:%M "

set -g window-status-format         " #I:#W "
set -g window-status-current-format " #I:#W "
set -g window-status-current-style  "bg=#cba6f7,fg=#11111b,bold"
set -g window-status-style          "fg=#6c7086"
set -g window-status-separator      ""

set -g pane-border-style        "fg=#313244"
# The red sun from the wallpaper, the same accent kitty and ghostty give the
# cursor — it is what marks "this one is live" everywhere else in this repo.
set -g pane-active-border-style "fg=#c0392b"
set -g message-style            "bg=#89b4fa,fg=#11111b,bold"
set -g mode-style               "bg=#f5e0dc,fg=#1e1e2e"
set -g clock-mode-colour        "#89b4fa"

# ── Keybindings ──────────────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# Splits and new windows inherit the current pane's directory, which is what
# kitty and ghostty do and what you almost always want.
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window   -c "#{pane_current_path}"
