# Alacritty — Catppuccin Mocha, matched to kitty and ghostty.
#
# TOML, which means Alacritty 0.13.0 (Dec 2023) or newer. Anything older reads
# alacritty.yml with entirely different key names and will ignore this file;
# `alacritty migrate` is the upgrade path.

# ── Font ─────────────────────────────────────────────────────────────────────
# ghostty's font and size exactly. (kitty's primary family is Maple Mono; it
# names JetBrainsMono Nerd Font only for its ligature font_features.)
[font]
size = 15

[font.normal]
family = "JetBrainsMono Nerd Font"
style  = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style  = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style  = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style  = "Bold Italic"

# ── Cursor ───────────────────────────────────────────────────────────────────
[cursor]
style            = { shape = "Beam", blinking = "On" }
unfocused_hollow = true

# ── Window ───────────────────────────────────────────────────────────────────
[window]
padding         = { x = 12, y = 8 }
dynamic_padding = true
decorations     = "None"

[scrolling]
history = 10000

[selection]
save_to_clipboard = true

[mouse]
hide_when_typing = true

# ── Colours ──────────────────────────────────────────────────────────────────
# Black background and the red-sun cursor, the same pair kitty/custom.conf and
# ghostty/config set. Alacritty cannot blend the wallpaper behind the text the
# way those two do, so this is the flat version of the same look.
[colors.primary]
background = "#000000"
foreground = "#cdd6f4"

[colors.cursor]
text   = "#1e1e2e"
cursor = "#c0392b"

[colors.selection]
text       = "#1e1e2e"
background = "#f5e0dc"

[colors.normal]
black   = "#45475a"
red     = "#f38ba8"
green   = "#a6e3a1"
yellow  = "#f9e2af"
blue    = "#89b4fa"
magenta = "#f5c2e7"
cyan    = "#94e2d5"
white   = "#bac2de"

[colors.bright]
black   = "#585b70"
red     = "#f38ba8"
green   = "#a6e3a1"
yellow  = "#f9e2af"
blue    = "#89b4fa"
magenta = "#f5c2e7"
cyan    = "#94e2d5"
white   = "#a6adc8"
