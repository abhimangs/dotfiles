# Catppuccin-friendly defaults. No absolute paths — portable across machines.
hwdec=auto-safe
vo=gpu-next
gpu-api=auto
profile=gpu-hq

osc=yes
osd-bar=yes
osd-font='JetBrainsMono Nerd Font'
osd-font-size=28

keep-open=yes
save-position-on-quit=yes
ytdl-format=bestvideo[height<=?1080]+bestaudio/best

slang=en,eng
alang=en,eng
sub-auto=fuzzy
